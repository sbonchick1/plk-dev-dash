<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Renovation Dashboard — Popeyes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:#f9fafb;min-height:100vh;color:#1a1a1a;}
.container{max-width:1700px;margin:0 auto;padding:40px;}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:14px;color:#9b9b9b;}
.breadcrumb a{color:#9b9b9b;text-decoration:none;}.breadcrumb a:hover{color:#E8521A;}
.page-title{font-size:36px;font-weight:700;color:#1a1a1a;margin-bottom:12px;letter-spacing:-1px;}
.page-subtitle{font-size:16px;color:#6b6b6b;line-height:1.6;margin-bottom:32px;}
/* KPI */
.kpi-banner{display:flex;flex-wrap:nowrap;gap:12px;margin-bottom:32px;}
.kpi-banner>.kpi-card{flex:1 1 0;min-width:0;}
.kpi-banner .kpi-value{font-size:clamp(15px,1.8vw,26px);}
.kpi-banner .kpi-label{font-size:clamp(7px,.65vw,10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-banner .kpi-sub{font-size:clamp(7px,.62vw,11px);}
.kpi-card{background:white;border-radius:12px;padding:16px 12px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--kpi-color,#E8521A);}
.kpi-label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600;}
.kpi-value{font-size:26px;font-weight:800;color:#1a1a1a;line-height:1;margin-bottom:4px;}
.kpi-sub{font-size:11px;color:#9ca3af;}
.kpi-good .kpi-value{color:#059669;}
/* Section */
.section{background:white;border-radius:16px;padding:32px;margin-bottom:32px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #f0f0f0;flex-wrap:wrap;gap:12px;}
.section-title{font-size:20px;font-weight:700;color:#1a1a1a;display:flex;align-items:center;gap:10px;}
/* Controls */
.ctrl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ctrl-lbl{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.ctrl-select{padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;color:#1a1a1a;background:white;cursor:pointer;font-family:inherit;}
.ctrl-select:focus{outline:none;border-color:#E8521A;}
/* Export */
.export-btn{display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;color:#16a34a;border:1px solid #86efac;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;}
.export-btn:hover{background:#dcfce7;border-color:#4ade80;}
.export-btn:disabled{opacity:.5;cursor:default;}
.export-btn svg{width:15px;height:15px;}
/* Chart cards */
.division-charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:24px;margin-top:4px;}
.chart-card{background:white;border-radius:12px;padding:24px;border:1px solid #e5e7eb;}
.chart-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:12px;}
.chart-header-left{flex:1;}
.chart-title{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:2px;}
.chart-subtitle{font-size:13px;color:#6b7280;margin-bottom:2px;}
.chart-hint{font-size:11px;color:#E8521A;margin-bottom:14px;display:flex;align-items:center;gap:4px;font-weight:500;}
.chart-canvas{max-height:320px;}
/* Legend */
.legend-bar{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
/* Loading overlay */
.overlay{position:fixed;inset:0;background:#f9fafb;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:48px;height:48px;border:4px solid #E8521A;border-top:4px solid transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-title{font-size:18px;font-weight:600;color:#374151;}
.overlay-sub{font-size:14px;color:#9ca3af;margin-top:8px;}
/* Drill-down modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{background:white;border-radius:16px;width:100%;max-width:1100px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.2);transform:translateY(20px);transition:transform .2s;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.modal-title{font-size:17px;font-weight:700;color:#1a1a1a;}
.modal-subtitle{font-size:13px;color:#6b7280;margin-top:2px;}
.modal-actions{display:flex;gap:8px;align-items:center;}
.modal-close{background:#f3f4f6;border:none;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#6b7280;}
.modal-close:hover{background:#fee2e2;color:#dc2626;}
.modal-filterbar{display:flex;gap:10px;align-items:center;padding:12px 24px;background:#f9fafb;border-bottom:1px solid #e5e7eb;flex-wrap:wrap;flex-shrink:0;}
.modal-filter-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.modal-select{padding:5px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;color:#374151;background:white;cursor:pointer;outline:none;}
.modal-select:focus{border-color:#E8521A;}
.modal-count{margin-left:auto;font-size:12px;color:#9ca3af;white-space:nowrap;}
.modal-reset{background:none;border:1px solid #e5e7eb;border-radius:6px;padding:5px 10px;font-size:12px;color:#6b7280;cursor:pointer;}
.modal-reset:hover{border-color:#E8521A;color:#E8521A;}
.modal-body{overflow-y:auto;padding:0 24px 20px;}
.modal-table{width:100%;border-collapse:collapse;font-size:12px;}
.modal-table thead th{background:#f9fafb;padding:9px 12px;text-align:left;font-weight:600;color:#6b7280;text-transform:uppercase;font-size:10px;letter-spacing:.4px;border-bottom:2px solid #e5e7eb;white-space:nowrap;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none;}
.modal-table thead th:hover{color:#E8521A;}
.modal-table thead th .sort-arrow{margin-left:4px;opacity:.4;font-size:9px;}
.modal-table thead th.sort-asc .sort-arrow::after{content:'▲';opacity:1;}
.modal-table thead th.sort-desc .sort-arrow::after{content:'▼';opacity:1;}
.modal-table thead th:not(.sort-asc):not(.sort-desc) .sort-arrow::after{content:'⇅';}
.modal-table tbody tr{border-bottom:1px solid #f3f4f6;}
.modal-table tbody tr:hover{background:#fef3ee;}
.modal-table tbody td{padding:10px 12px;color:#374151;}
.modal-empty{text-align:center;padding:40px;color:#9ca3af;font-size:14px;}
.stage-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:white;}
@media(max-width:768px){.container{padding:24px;}.page-title{font-size:28px;}.division-charts-grid{grid-template-columns:1fr;}.kpi-banner{flex-wrap:wrap!important;}}
</style>
</head>
<body>

<div id="loading-overlay" class="overlay">
  <div class="spinner"></div>
  <div class="overlay-title">Loading renovation data…</div>
  <div class="overlay-sub">Fetching live data from Smartsheet</div>
</div>

<!-- Drill-down modal -->
<div class="modal-overlay" id="drill-modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Restaurants</div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <div class="modal-actions">
        <button class="export-btn" onclick="exportModalToExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Export to Excel
        </button>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-filterbar">
      <span class="modal-filter-label">Filter:</span>
      <select class="modal-select" id="modal-filter-stage" onchange="renderModalTable()">
        <option value="">All Stages</option>
      </select>
      <select class="modal-select" id="modal-filter-bu" onchange="renderModalTable()">
        <option value="">All BUs</option>
      </select>
      <button class="modal-reset" onclick="resetModalFilters()">Reset</button>
      <span class="modal-count" id="modal-count"></span>
    </div>
    <div class="modal-body">
      <table class="modal-table">
        <thead>
          <tr id="modal-thead-row">
            <th onclick="sortModal(0)">Store #<span class="sort-arrow"></span></th>
            <th onclick="sortModal(1)">Division<span class="sort-arrow"></span></th>
            <th onclick="sortModal(2)">BU<span class="sort-arrow"></span></th>
            <th onclick="sortModal(3)">Stage<span class="sort-arrow"></span></th>
            <th onclick="sortModal(4)">Raw Status<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="modal-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
<div class="container">

  <div class="breadcrumb">
    <a href="/">Home</a>
    <span style="color:#d0d0d0">/</span>
    <span>Renovation Dashboard</span>
  </div>

  <h1 class="page-title">Renovation Dashboard</h1>
  <p class="page-subtitle">Stage waterfall by division — live from the Renovation Tracker &nbsp;·&nbsp; <span id="last-updated" style="color:#9ca3af;"></span></p>

  <div class="kpi-banner" id="kpi-banner"></div>

  <div class="section">
    <div class="section-header">
      <div class="section-title"><span>🔨</span>Renovation Stage Waterfall by Division</div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">BU Filter</span>
        <select class="ctrl-select" id="bu-filter" onchange="onBUChange()">
          <option value="">All BUs</option>
        </select>
        <button class="export-btn" onclick="exportAllToExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Export All to Excel
        </button>
      </div>
    </div>

    <div class="division-charts-grid" id="division-charts"></div>

    <div class="legend-bar" id="legend-bar"></div>
  </div>

</div>
</div>

<script>
// ── Brand colors ─────────────────────────────────────────────────────────────
const PLK = { orange:"#E8521A", purple:"#7B2D8B", teal:"#00A99D", red:"#C1272D" };

const STAGES = ['Not Started','360 Phase','In Design','Permitting','Under Construction','Punch List','Complete','Total LE'];
const STAGE_COLORS = {
  'Not Started':        PLK.orange,
  '360 Phase':          PLK.orange,
  'In Design':          PLK.orange,
  'Permitting':         PLK.orange,
  'Under Construction': PLK.orange,
  'Punch List':         PLK.orange,
  'Complete':           PLK.orange,
  'Total LE':           PLK.teal,
};

const DIVISIONS = [
  { key:'northeast', label:'Northeast' },
  { key:'southeast', label:'Southeast' },
  { key:'central',   label:'Central'   },
  { key:'west',      label:'West'      },
];

let ALL_ROWS = [];
const CHARTS = {};

// ── Waterfall math ───────────────────────────────────────────────────────────
function buildWaterfall(stageCounts, total) {
  const bases = [], bars = [], colors = [], displayVals = [];
  let cum = 0;
  STAGES.forEach(function(stage) {
    if (stage === 'Total LE') {
      bases.push(0); bars.push(total); displayVals.push(total);
    } else {
      const v = stageCounts[stage] || 0;
      bases.push(cum); bars.push(v); displayVals.push(v);
      cum += v;
    }
    colors.push(STAGE_COLORS[stage]);
  });
  return { bases, bars, colors, displayVals };
}

// ── KPI banner ───────────────────────────────────────────────────────────────
function renderKPIBanner(rows) {
  const counts = {};
  STAGES.forEach(function(s) { if (s !== 'Total LE') counts[s] = 0; });
  rows.forEach(function(r) { if (r.stage && counts[r.stage] !== undefined) counts[r.stage]++; });
  const total = rows.length;
  const pctComplete = total > 0 ? Math.round(counts['Complete'] / total * 100) : 0;

  const cards = [
    { label:'Total LE',           value: total,                      sub:'BU 1–12 renovation projects',     color: PLK.teal   },
    { label:'Complete',           value: counts['Complete'],         sub: pctComplete + '% of total LE',    color:'#059669',  cls: pctComplete >= 75 ? 'kpi-good' : '' },
    { label:'Under Construction', value: counts['Under Construction'],sub:'actively under construction',    color: PLK.orange },
    { label:'Punch List',         value: counts['Punch List'],       sub:'awaiting closeout items',         color: PLK.red    },
    { label:'Permitting',         value: counts['Permitting'],       sub:'in permitting / CGBR',            color:'#F7941D'   },
    { label:'In Design',          value: counts['In Design'],        sub:'pending design submittal',        color: PLK.purple },
    { label:'360 Phase',          value: counts['360 Phase'],        sub:'survey / scope / on hold',        color:'#3b82f6'   },
    { label:'Not Started',        value: counts['Not Started'],      sub:'yet to begin',                    color:'#9ca3af'   },
  ];

  document.getElementById('kpi-banner').innerHTML = cards.map(function(c) {
    return '<div class="kpi-card ' + (c.cls || '') + '" style="--kpi-color:' + c.color + '">' +
      '<div class="kpi-label">' + c.label + '</div>' +
      '<div class="kpi-value">' + c.value + '</div>' +
      '<div class="kpi-sub">' + c.sub + '</div>' +
      '</div>';
  }).join('');
}

// ── Render one division chart ────────────────────────────────────────────────
function renderDivisionChart(div, rows) {
  const counts = {};
  STAGES.forEach(function(s) { if (s !== 'Total LE') counts[s] = 0; });
  rows.forEach(function(r) { if (r.stage && counts[r.stage] !== undefined) counts[r.stage]++; });
  const total = rows.length;
  const wf = buildWaterfall(counts, total);

  const canvasId = 'chart-' + div.key;
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;

  if (CHARTS[div.key]) {
    CHARTS[div.key].data.datasets[0].data = wf.bases;
    CHARTS[div.key].data.datasets[1].data = wf.bars;
    CHARTS[div.key].data.datasets[1].backgroundColor = wf.colors;
    CHARTS[div.key]._displayVals = wf.displayVals;
    CHARTS[div.key].update('active');

    // Update subtitle count
    const sub = document.getElementById('sub-' + div.key);
    if (sub) sub.textContent = total + ' total · ' + (counts['Complete'] || 0) + ' complete';
    return;
  }

  CHARTS[div.key] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: STAGES,
      datasets: [
        {
          label: '_base',
          data: wf.bases,
          backgroundColor: 'rgba(0,0,0,0)',
          borderColor: 'rgba(0,0,0,0)',
          borderWidth: 0,
          stack: 'wf',
        },
        {
          label: '_bars',
          data: wf.bars,
          backgroundColor: wf.colors,
          borderRadius: 4,
          barPercentage: 0.6,
          stack: 'wf',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: false,
      interaction: { mode: 'nearest', intersect: true },
      plugins: {
        legend: { display: false },
        tooltip: {
          animation: false,
          backgroundColor: '#1f2937',
          titleColor: 'white',
          bodyColor: 'white',
          padding: 10,
          cornerRadius: 6,
          filter: function(item) { return item.datasetIndex === 1; },
          callbacks: {
            label: function(ctx) {
              const stage = STAGES[ctx.dataIndex];
              const val = ctx.raw;
              if (stage === 'Total LE') return ' Total LE: ' + val + '  ·  Click to view all';
              let running = 0;
              for (let i = 0; i <= ctx.dataIndex; i++) {
                if (STAGES[i] !== 'Total LE') running += (counts[STAGES[i]] || 0);
              }
              return ' ' + stage + ': ' + val + '  |  Running: ' + running + '  ·  Click to view';
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          grid: { display: false },
          border: { display: false },
          ticks: { color: '#6b7280', font: { size: 11 } }
        },
        y: {
          stacked: true,
          beginAtZero: true,
          grid: { display: false },
          border: { display: false },
          ticks: { display: false }
        }
      },
      layout: { padding: { top: 28 } }
    },
    plugins: [{
      id: 'lbl_' + div.key,
      afterDraw: function(chart) {
        const meta = chart.getDatasetMeta(1);
        if (!meta || !meta.data) return;
        const dv = chart._displayVals || wf.displayVals;
        const cCtx = chart.ctx;
        const FONT = 'bold 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
        const MIN_H = 18;
        dv.forEach(function(val, i) {
          if (val === 0) return;
          const bar = meta.data[i];
          if (!bar) return;
          const barH = Math.abs(bar.base - bar.y);
          const barTop = Math.min(bar.y, bar.base);
          const barMidY = (bar.y + bar.base) / 2;
          cCtx.save();
          cCtx.font = FONT;
          cCtx.textAlign = 'center';
          if (barH >= MIN_H) {
            cCtx.fillStyle = '#FFFFFF';
            cCtx.textBaseline = 'middle';
            cCtx.fillText(String(val), bar.x, barMidY);
          } else {
            cCtx.fillStyle = '#374151';
            cCtx.textBaseline = 'bottom';
            cCtx.fillText(String(val), bar.x, barTop - 3);
          }
          cCtx.restore();
        });
      }
    }]
  });

  // Store display vals on chart instance for updates
  CHARTS[div.key]._displayVals = wf.displayVals;

  // Click to drill down
  ctx.style.cursor = 'pointer';
  ctx.addEventListener('click', function(e) {
    const chart = Chart.getChart(ctx);
    if (!chart) return;
    const pts = chart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, false);
    if (!pts.length) return;
    const idx = pts[0].index;
    const stage = STAGES[idx];
    const buFilter = document.getElementById('bu-filter').value;
    let sites = ALL_ROWS.filter(function(r) { return r.division === div.label; });
    if (buFilter) sites = sites.filter(function(r) { return String(r.bu) === buFilter; });
    if (stage !== 'Total LE') sites = sites.filter(function(r) { return r.stage === stage; });
    openModal(div.label + ' — ' + stage, div.label, sites);
  });
}

// ── Build division chart card HTML ───────────────────────────────────────────
function buildChartCards(filteredRows) {
  let html = '';
  DIVISIONS.forEach(function(div) {
    const divRows = filteredRows.filter(function(r) { return r.division === div.label; });
    const total   = divRows.length;
    const complete = divRows.filter(function(r) { return r.stage === 'Complete'; }).length;
    html += '<div class="chart-card">' +
      '<div class="chart-header">' +
        '<div class="chart-header-left">' +
          '<div class="chart-title">' + div.label + '</div>' +
          '<div class="chart-subtitle" id="sub-' + div.key + '">' + total + ' total · ' + complete + ' complete</div>' +
          '<div class="chart-hint">↖ Click bars to see restaurant details</div>' +
        '</div>' +
        '<button class="export-btn" onclick="exportDivisionToExcel(\'' + div.label + '\',this)">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
          'Export' +
        '</button>' +
      '</div>' +
      '<canvas id="chart-' + div.key + '" class="chart-canvas"></canvas>' +
    '</div>';
  });
  document.getElementById('division-charts').innerHTML = html;
}

// ── Legend ───────────────────────────────────────────────────────────────────
function buildLegend() {
  const el = document.getElementById('legend-bar');
  el.innerHTML = STAGES.map(function(s) {
    return '<div class="legend-item"><div class="legend-dot" style="background:' + STAGE_COLORS[s] + '"></div>' + s + '</div>';
  }).join('');
}

// ── BU dropdown ──────────────────────────────────────────────────────────────
function populateBUDropdown() {
  const buSet = new Set();
  ALL_ROWS.forEach(function(r) { if (r.bu) buSet.add(String(r.bu)); });
  const bus = Array.from(buSet).sort(function(a, b) {
    return parseFloat(a) - parseFloat(b) || a.localeCompare(b);
  });
  const sel = document.getElementById('bu-filter');
  bus.forEach(function(bu) {
    const opt = document.createElement('option');
    opt.value = bu; opt.textContent = 'BU ' + bu;
    sel.appendChild(opt);
  });
}

function onBUChange() {
  const buFilter = document.getElementById('bu-filter').value;
  const filtered = buFilter ? ALL_ROWS.filter(function(r) { return String(r.bu) === buFilter; }) : ALL_ROWS;
  renderKPIBanner(filtered);
  DIVISIONS.forEach(function(div) {
    const divRows = filtered.filter(function(r) { return r.division === div.label; });
    renderDivisionChart(div, divRows);
    const sub = document.getElementById('sub-' + div.key);
    if (sub) {
      const c = divRows.filter(function(r) { return r.stage === 'Complete'; }).length;
      sub.textContent = divRows.length + ' total · ' + c + ' complete';
    }
  });
}

// ── Modal ────────────────────────────────────────────────────────────────────
let MODAL_ROWS = [], MODAL_TITLE_TEXT = '';
let modalSortCol = -1, modalSortDir = 1;

function openModal(title, divisionLabel, rows) {
  MODAL_ROWS = rows;
  MODAL_TITLE_TEXT = title;

  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-subtitle').textContent = rows.length + ' restaurant' + (rows.length !== 1 ? 's' : '');

  // Populate stage filter
  const stages = Array.from(new Set(rows.map(function(r) { return r.stage; }))).sort();
  const stageSelect = document.getElementById('modal-filter-stage');
  stageSelect.innerHTML = '<option value="">All Stages</option>';
  stages.forEach(function(s) {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    stageSelect.appendChild(opt);
  });

  // Populate BU filter
  const bus = Array.from(new Set(rows.map(function(r) { return r.bu; }).filter(Boolean))).sort(function(a,b){ return parseFloat(a)-parseFloat(b)||String(a).localeCompare(String(b)); });
  const buSelect = document.getElementById('modal-filter-bu');
  buSelect.innerHTML = '<option value="">All BUs</option>';
  bus.forEach(function(bu) {
    const opt = document.createElement('option');
    opt.value = bu; opt.textContent = 'BU ' + bu;
    buSelect.appendChild(opt);
  });

  modalSortCol = -1; modalSortDir = 1;
  document.querySelectorAll('#modal-thead-row th').forEach(function(th) { th.classList.remove('sort-asc','sort-desc'); });
  renderModalTable();
  document.getElementById('drill-modal').classList.add('open');
}

function closeModal() { document.getElementById('drill-modal').classList.remove('open'); }
document.getElementById('drill-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

function getModalRow(r) { return [r.plk || '', r.division || '', String(r.bu || ''), r.stage || '', r.rawStatus || '']; }

function renderModalTable() {
  const stageF = document.getElementById('modal-filter-stage').value;
  const buF    = document.getElementById('modal-filter-bu').value;
  let rows = MODAL_ROWS.filter(function(r) {
    return (!stageF || r.stage === stageF) && (!buF || String(r.bu) === buF);
  });
  if (modalSortCol >= 0) {
    rows = rows.slice().sort(function(a, b) {
      const av = getModalRow(a)[modalSortCol], bv = getModalRow(b)[modalSortCol];
      return av.localeCompare(bv, undefined, { sensitivity:'base', numeric:true }) * modalSortDir;
    });
  }
  document.getElementById('modal-count').textContent = rows.length + ' restaurant' + (rows.length !== 1 ? 's' : '');
  const tbody = document.getElementById('modal-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="modal-empty">No restaurants match the current filters.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(r) {
    const color = STAGE_COLORS[r.stage] || '#9ca3af';
    return '<tr>' +
      '<td><strong>' + (r.plk || '—') + '</strong></td>' +
      '<td>' + (r.division || '—') + '</td>' +
      '<td>' + (r.bu ? 'BU ' + r.bu : '—') + '</td>' +
      '<td>' + (r.stage || '—') + '</td>' +
      '<td style="color:#6b7280;font-size:11px;">' + (r.rawStatus || '—') + '</td>' +
    '</tr>';
  }).join('');
}

function sortModal(col) {
  const ths = document.querySelectorAll('#modal-thead-row th');
  modalSortDir = (modalSortCol === col) ? modalSortDir * -1 : 1;
  modalSortCol = col;
  ths.forEach(function(th, i) {
    th.classList.remove('sort-asc','sort-desc');
    if (i === col) th.classList.add(modalSortDir === 1 ? 'sort-asc' : 'sort-desc');
  });
  renderModalTable();
}
function resetModalFilters() {
  document.getElementById('modal-filter-stage').value = '';
  document.getElementById('modal-filter-bu').value = '';
  modalSortCol = -1; modalSortDir = 1;
  document.querySelectorAll('#modal-thead-row th').forEach(function(th) { th.classList.remove('sort-asc','sort-desc'); });
  renderModalTable();
}

// ── Exports ──────────────────────────────────────────────────────────────────
function buildDetailRows(rows) {
  const out = [['Store #','Division','BU','Stage','Raw Status']];
  rows.forEach(function(r) {
    out.push([r.plk || '', r.division || '', r.bu || '', r.stage || '', r.rawStatus || '']);
  });
  return out;
}

function buildSummaryRows(rows, title) {
  const counts = {};
  STAGES.forEach(function(s) { if (s !== 'Total LE') counts[s] = 0; });
  rows.forEach(function(r) { if (r.stage && counts[r.stage] !== undefined) counts[r.stage]++; });
  const out = [[title, 'Count']];
  STAGES.forEach(function(s) {
    if (s === 'Total LE') out.push(['Total LE', rows.length]);
    else out.push([s, counts[s]]);
  });
  return out;
}

function exportModalToExcel() {
  const stageF = document.getElementById('modal-filter-stage').value;
  const buF    = document.getElementById('modal-filter-bu').value;
  const rows   = MODAL_ROWS.filter(function(r) {
    return (!stageF || r.stage === stageF) && (!buF || String(r.bu) === buF);
  });
  if (!rows.length) return;
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(buildDetailRows(rows));
  ws['!cols'] = [10, 12, 6, 20, 36].map(function(w) { return { wch: w }; });
  XLSX.utils.book_append_sheet(wb, ws, 'Restaurants');
  XLSX.writeFile(wb, (MODAL_TITLE_TEXT || 'Renovations').replace(/[^a-zA-Z0-9 ]/g, '_') + '.xlsx');
}

function exportDivisionToExcel(divisionLabel, btn) {
  const buFilter = document.getElementById('bu-filter').value;
  let rows = ALL_ROWS.filter(function(r) { return r.division === divisionLabel; });
  if (buFilter) rows = rows.filter(function(r) { return String(r.bu) === buFilter; });

  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.textContent = 'Exporting…'; btn.disabled = true; }
  try {
    const wb = XLSX.utils.book_new();
    const wsSummary = XLSX.utils.aoa_to_sheet(buildSummaryRows(rows, 'Stage'));
    wsSummary['!cols'] = [{ wch: 22 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
    const wsDetail = XLSX.utils.aoa_to_sheet(buildDetailRows(rows));
    wsDetail['!cols'] = [10, 12, 6, 20, 36].map(function(w) { return { wch: w }; });
    XLSX.utils.book_append_sheet(wb, wsDetail, 'Restaurants');
    XLSX.writeFile(wb, 'Renovations_' + divisionLabel.replace(/\s/g, '_') + (buFilter ? '_BU' + buFilter : '') + '.xlsx');
  } finally {
    if (btn) { btn.innerHTML = orig; btn.disabled = false; }
  }
}

function exportAllToExcel() {
  const buFilter = document.getElementById('bu-filter').value;
  const filtered = buFilter ? ALL_ROWS.filter(function(r) { return String(r.bu) === buFilter; }) : ALL_ROWS;
  const wb = XLSX.utils.book_new();

  // Summary sheet
  const summaryRows = [['Division', 'Not Started', '360 Phase', 'In Design', 'Permitting', 'Under Construction', 'Punch List', 'Complete', 'Total LE']];
  const totals = {};
  STAGES.forEach(function(s) { if (s !== 'Total LE') totals[s] = 0; });

  DIVISIONS.forEach(function(div) {
    const rows = filtered.filter(function(r) { return r.division === div.label; });
    const counts = {};
    STAGES.forEach(function(s) { if (s !== 'Total LE') counts[s] = 0; });
    rows.forEach(function(r) { if (r.stage && counts[r.stage] !== undefined) counts[r.stage]++; });
    STAGES.forEach(function(s) { if (s !== 'Total LE') totals[s] += counts[s]; });
    summaryRows.push([div.label, counts['Not Started'], counts['360 Phase'], counts['In Design'], counts['Permitting'], counts['Under Construction'], counts['Punch List'], counts['Complete'], rows.length]);
  });
  summaryRows.push(['Total', totals['Not Started'], totals['360 Phase'], totals['In Design'], totals['Permitting'], totals['Under Construction'], totals['Punch List'], totals['Complete'], filtered.length]);

  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [14, 12, 10, 10, 12, 18, 12, 10, 10].map(function(w) { return { wch: w }; });
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary by Division');

  // Detail sheet
  const wsDetail = XLSX.utils.aoa_to_sheet(buildDetailRows(filtered));
  wsDetail['!cols'] = [10, 12, 6, 20, 36].map(function(w) { return { wch: w }; });
  XLSX.utils.book_append_sheet(wb, wsDetail, 'All Restaurants');

  XLSX.writeFile(wb, 'Renovations_All_Divisions' + (buFilter ? '_BU' + buFilter : '') + '.xlsx');
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const resp = await fetch('/api/renovations');
    if (!resp.ok) {
      const err = await resp.json().catch(function() { return {}; });
      throw new Error(err.error || 'HTTP ' + resp.status);
    }
    const data = await resp.json();
    if (!data.rows || data.rows.length === 0)
      throw new Error('No renovation records returned — check /api/renovations?debug=1 to verify column names.');

    ALL_ROWS = data.rows;

    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date(data.lastUpdated).toLocaleString();

    populateBUDropdown();
    renderKPIBanner(ALL_ROWS);
    buildChartCards(ALL_ROWS);
    buildLegend();

    DIVISIONS.forEach(function(div) {
      const divRows = ALL_ROWS.filter(function(r) { return r.division === div.label; });
      renderDivisionChart(div, divRows);
    });

  } catch(err) {
    document.getElementById('loading-overlay').innerHTML =
      '<div style="font-size:40px;margin-bottom:16px;">⚠️</div>' +
      '<div style="font-size:18px;font-weight:700;color:#374151;margin-bottom:8px;">Could not load data</div>' +
      '<div style="font-size:14px;color:#9ca3af;max-width:480px;text-align:center;">' + err.message + '</div>';
  }
}

init();
</script>
